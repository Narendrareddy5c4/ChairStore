{% extends "base.html" %}
{% block title %}Edit Category{% endblock %}
{% block content %}
<div class="section" style="max-width:600px;">
  <div class="breadcrumb"><a href="/">Home</a><span class="bc-sep">›</span><a href="/chairs/categorylist">Categories</a><span class="bc-sep">›</span>Edit</div>
  <div class="form-wrap">
    <div style="font-size:36px;margin-bottom:14px;">✏️</div>
    <div class="form-title">Edit Category</div>
    <div class="form-sub">Update the name of this chair category.</div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Category Name *</label>
        <input class="form-input" type="text" name="category_name" value="{{ chair_name }}" required autofocus/>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary btn-lg" type="submit">💾 Save Changes</button>
        <a class="btn btn-ghost btn-lg" href="/chairs/categorylist">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
