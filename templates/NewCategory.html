{% extends "base.html" %}
{% block title %}New Category{% endblock %}
{% block content %}
<div class="section" style="max-width:600px;">
  <div class="breadcrumb"><a href="/">Home</a><span class="bc-sep">›</span><a href="/chairs/categorylist">Categories</a><span class="bc-sep">›</span>New Category</div>
  <div class="form-wrap">
    <div style="font-size:36px;margin-bottom:14px;">📂</div>
    <div class="form-title">Create New Category</div>
    <div class="form-sub">Add a new chair category to organize your listings.</div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Category Name *</label>
        <input class="form-input" type="text" name="category_name" placeholder="e.g. Office Chairs, Gaming Chairs..." required autofocus/>
        <div style="font-size:11px;color:#9B9BAA;margin-top:4px;">Choose a clear, descriptive name for this category.</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary btn-lg" type="submit">➕ Create Category</button>
        <a class="btn btn-ghost btn-lg" href="/chairs/categorylist">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
